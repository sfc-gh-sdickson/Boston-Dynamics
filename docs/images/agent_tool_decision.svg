<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shLg">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" fill="#1a1a2e" font-size="26" font-weight="bold">Agent Tool Decision Flow</text>
  <text x="600" y="65" text-anchor="middle" fill="#666" font-size="13">How BOSTON_DYNAMICS_AGENT Routes Questions to the Right Tool (27 Tools)</text>

  <rect x="400" y="90" width="400" height="50" rx="10" fill="#29b5e8" filter="url(#sh)"/>
  <text x="600" y="121" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">User Asks a Natural Language Question</text>
  <line x1="600" y1="140" x2="600" y2="165" stroke="#29b5e8" stroke-width="2"/>
  <polygon points="596,163 604,163 600,173" fill="#29b5e8"/>

  <rect x="380" y="175" width="440" height="55" rx="12" fill="#e8530e" filter="url(#shLg)"/>
  <text x="600" y="200" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">BOSTON_DYNAMICS_AGENT</text>
  <text x="600" y="218" text-anchor="middle" fill="#ffe0cc" font-size="11">Orchestrator reads intent, entities and time range</text>
  <line x1="600" y1="230" x2="600" y2="250" stroke="#e8530e" stroke-width="2"/>
  <polygon points="596,248 604,248 600,258" fill="#e8530e"/>

  <polygon points="600,260 730,315 600,370 470,315" fill="#fff8f0" stroke="#e8530e" stroke-width="2" filter="url(#sh)"/>
  <text x="600" y="311" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Classify</text>
  <text x="600" y="328" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Intent</text>

  <line x1="600" y1="370" x2="600" y2="400" stroke="#888" stroke-width="2"/>
  <line x1="155" y1="400" x2="1055" y2="400" stroke="#888" stroke-width="2"/>
  <line x1="155" y1="400" x2="155" y2="422" stroke="#29b5e8" stroke-width="2"/>
  <polygon points="151,420 159,420 155,430" fill="#29b5e8"/>
  <line x1="455" y1="400" x2="455" y2="422" stroke="#00a843" stroke-width="2"/>
  <polygon points="451,420 459,420 455,430" fill="#00a843"/>
  <line x1="755" y1="400" x2="755" y2="422" stroke="#7b61ff" stroke-width="2"/>
  <polygon points="751,420 759,420 755,430" fill="#7b61ff"/>
